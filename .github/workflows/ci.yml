name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: crashmemory_ci
          POSTGRES_USER: crashmemory
          POSTGRES_PASSWORD: crashmemory-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crashmemory -d crashmemory_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://crashmemory:crashmemory-ci-only@127.0.0.1:5432/crashmemory_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      TEST_OBJECT_STORAGE_BUCKET: crashmemory-ci
      TEST_OBJECT_STORAGE_ACCESS_KEY: crashmemory-ci
      TEST_OBJECT_STORAGE_SECRET_KEY: crashmemory-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require README update for the delivery
        run: node scripts/check-readme-change.mjs "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" "$GITHUB_BASE_REF"
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Start MinIO for runtime integration tests
        run: |
          docker run -d --name crashmemory-minio-ci \
            -e MINIO_ROOT_USER=crashmemory-ci \
            -e MINIO_ROOT_PASSWORD=crashmemory-ci-only \
            -p 9000:9000 \
            ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 \
            server /data
          for attempt in $(seq 1 20)
          do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live
            then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run workspace checks
        run: pnpm check
      - name: Build workspace packages
        run: pnpm build
