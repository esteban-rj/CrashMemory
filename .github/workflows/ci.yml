name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541d113ed5d91b8a06b6a5d7caa79a # v4.0.3
        with:
          node-version: 24.14.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Require README update for the delivery
        run: node scripts/check-readme-change.mjs "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" "$GITHUB_BASE_REF"
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Run workspace checks
        run: pnpm check
      - name: Build workspace packages
        run: pnpm build
